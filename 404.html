<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/site/images/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Page not found · Splyto</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#BFEFEA">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="/site/css/base.css?v=1">
  <link rel="stylesheet" href="/site/css/components.css?v=1">
  <link rel="stylesheet" href="/site/css/sections.css?v=1">
  <style>
    /* The footer stays at the bottom of short screens. */
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .not-found { flex: 1; background: var(--wash); border-top: 1px solid var(--line); }
    .not-found .wrap { max-width: 640px; min-height: 62vh; padding-top: 72px; padding-bottom: 88px;
                       display: flex; flex-direction: column; justify-content: center; }
    .not-found .code { color: var(--green); font-weight: 700; font-size: 15px; letter-spacing: .08em; }
    .not-found h1 { margin-top: 10px; color: var(--ink); font-size: clamp(32px, 6vw, 46px); line-height: 1.1; letter-spacing: -.02em; }
    .not-found p { margin-top: 14px; color: var(--muted); font-size: 18px; line-height: 1.6; }
    .not-found .links { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
    .not-found .home { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px;
                       border-radius: 14px; background: var(--green); color: #fff; font-weight: 600; text-decoration: none; }
    .not-found .home:hover { filter: brightness(1.06); }
    .not-found .home:focus-visible, .not-found .more:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .not-found .more { display: inline-flex; align-items: center; min-height: 48px; padding: 0 6px;
                       color: var(--green); font-weight: 600; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-logo" href="/" aria-label="Splyto home">
        <img src="/site/images/logo.svg" width="180" height="71" alt="">
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="/#features">Features</a>
        <a href="/#how">How it works</a>
        <a href="/#privacy">Privacy</a>
      </nav>
    </div>
  </header>

  <main class="not-found">
    <div class="wrap">
      <p class="code">404</p>
      <h1>This page isn’t here</h1>
      <p>The link may be old or mistyped. Everything about Splyto starts on the home page.</p>
      <div class="links">
        <a class="home" href="/">Go to the home page</a>
        <a class="more" href="mailto:support@splyto.eu">Contact us</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 2026 Splyto</span>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Use</a>
      <a href="mailto:support@splyto.eu">Contact</a>
    </div>
  </footer>
</body>
</html>
