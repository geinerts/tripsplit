# Website pages: clean addresses, one address per page and our own 404 page.
# Included inside the splyto.eu server block next to private-upload-locations.conf
# by scripts/apply_site_pages_nginx.sh, which also tests and reloads nginx.

# Hide the nginx version on error pages and in headers.
server_tokens off;

# One address for the site: www.splyto.eu goes to splyto.eu. A return at
# server level runs before any location.
if ($host = www.splyto.eu) {
    return 301 https://splyto.eu$request_uri;
}

# Pages that don't exist show the site's 404 page with status 404. Only errors
# nginx makes itself use it; API JSON errors from PHP are left as they are.
error_page 404 /404.html;
location = /404.html {
    root /var/www/splyto;
    internal;
}

# Clean addresses. try_files serves the file in place, without a redirect.
location = /privacy {
    root /var/www/splyto;
    default_type text/html;
    try_files /privacy.html =404;
}
location = /terms {
    root /var/www/splyto;
    default_type text/html;
    try_files /terms.html =404;
}

# Old addresses keep working: the apps, App Store and Google Play link to
# privacy.html. Only addresses typed or linked are redirected ($request_uri);
# nginx's own internal step from / to /index.html is served as before, or the
# home page would redirect to itself.
location = /privacy.html {
    root /var/www/splyto;
    if ($request_uri ~ ^/privacy\.html(?:\?|$)) {
        return 301 /privacy$is_args$args;
    }
}
location = /terms.html {
    root /var/www/splyto;
    if ($request_uri ~ ^/terms\.html(?:\?|$)) {
        return 301 /terms$is_args$args;
    }
}
location = /index.html {
    root /var/www/splyto;
    if ($request_uri ~ ^/index\.html(?:\?|$)) {
        return 301 /$is_args$args;
    }
}
