# Confirmation URLs contain single-use proofs and must not enter origin access logs.
location ~ ^/api/(?:deactivate-account|delete-account|reactivate-account)\.php$ {
    root /var/www/splyto;
    try_files $uri =404;
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/splyto$fastcgi_script_name;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
}

# The signed receipt endpoint must precede the generic /api deny rule.
location = /api/receipt-media.php {
    root /var/www/splyto;
    try_files $uri =404;
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/splyto/api/receipt-media.php;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
}

# Private source, operations files and deployment backups are not web assets.
location ~* ^/(?:backend|docs|ops|logs|scripts|sql|mobile|keys|vendor|node_modules)(?:/|$) {
    return 404;
}

location ~* (?:\.(?:bak|old|orig|save|swp|swo|sql|sqlite|sqlite3|log)(?:[._~-].*)?|~)$ {
    return 404;
}

# Feedback screenshots may contain private account and device information.
# They must only be served through a future authenticated admin media route.
location ^~ /uploads/feedback/ {
    return 404;
}

# Receipt URLs are short-lived and signed by the API. Never expose storage directly.
location ^~ /uploads/receipts/ {
    return 404;
}
