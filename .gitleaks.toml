title = "Splyto Gitleaks Configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Dependency lockfile checksums that look like tokens but are not secrets."
paths = [
  '''mobile/ios/Podfile\.lock$''',
  '''mobile/pubspec\.lock$''',
]

[[allowlists]]
description = "Exact localization message identifier in translation review metadata, not a credential."
regexTarget = "match"
regexes = ['''key": "percentSplitMustBe100"''']
