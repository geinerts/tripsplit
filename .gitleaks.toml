title = "Splyto Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Dependency checksums and exact localization identifiers, not credentials. Compatible with the CI scanner."
paths = [
  '''mobile/ios/Podfile\.lock$''',
  '''mobile/pubspec\.lock$''',
]

regexTarget = "secret"
regexes = [
  '''^percentSplitMustBe100$''',
  # Finnish 'salasana' (password) makes the following ARB key match the Asana rule.
  '''^profileEditBankTransferIbanSwift$''',
]
